name: Hata / Bug
description: Bir şey beklendiği gibi çalışmıyor / Something doesn't work as expected
labels: ["hata", "bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Ne oldu, ne bekliyordun? / What happened, what did you expect?
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Mac modeli ve macOS sürümü / Mac model and macOS version
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: "`pervane json` çıktısı / output"
      render: json
  - type: textarea
    id: log
    attributes:
      label: "`tail -50 /var/log/pervaned.log`"
      render: text
