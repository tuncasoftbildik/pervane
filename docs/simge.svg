<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151d3b"/>
      <stop offset="0.55" stop-color="#0e1530"/>
      <stop offset="1" stop-color="#22134a"/>
    </linearGradient>
    <linearGradient id="kanat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="isi" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.6" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="hale" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="parilti" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <path id="k" d="M0 -18 C 34 -40, 62 -92, 20 -112 C -18 -128, -44 -84, -22 -44 C -16 -32, -8 -24, 0 -18 Z"/>
    <clipPath id="kare"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g clip-path="url(#kare)">
    <rect x="100" y="100" width="824" height="824" fill="url(#zemin)"/>
    <circle cx="512" cy="512" r="420" fill="url(#hale)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#parilti)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- çerçeve halkası -->
  <circle cx="512" cy="512" r="318" fill="none" stroke="#2a3558" stroke-width="26"/>
  <!-- sıcaklık yayı: soğuktan sıcağa -->
  <path d="M 287 737 A 318 318 0 0 1 737 287" fill="none" stroke="url(#isi)" stroke-width="26" stroke-linecap="round"/>

  <!-- kanatlar -->
  <g transform="translate(512 512) scale(2.45) rotate(-8)">
    <g fill="url(#kanat)">
      <use xlink:href="#k"/>
      <use xlink:href="#k" transform="rotate(72)"/>
      <use xlink:href="#k" transform="rotate(144)"/>
      <use xlink:href="#k" transform="rotate(216)"/>
      <use xlink:href="#k" transform="rotate(288)"/>
    </g>
    <circle r="22" fill="#0e1530" stroke="#7dd3fc" stroke-width="5"/>
    <circle r="7" fill="#7dd3fc"/>
  </g>
</svg>
