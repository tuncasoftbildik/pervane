<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Pervane: Open-source fan control for macOS">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1b1035"/>
    </linearGradient>
    <linearGradient id="kanat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="isi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.6" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="hale" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <path id="k" d="M0 -18 C 34 -40, 62 -92, 20 -112 C -18 -128, -44 -84, -22 -44 C -16 -32, -8 -24, 0 -18 Z"/>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#zemin)"/>

  <!-- Fan -->
  <circle cx="220" cy="180" r="170" fill="url(#hale)"/>
  <circle cx="220" cy="180" r="128" fill="none" stroke="#2a3558" stroke-width="10"/>
  <circle cx="220" cy="180" r="128" fill="none" stroke="#3b4a7a" stroke-width="2"/>
  <g transform="translate(220 180)">
    <g fill="url(#kanat)" opacity="0.95">
      <use href="#k"/>
      <use href="#k" transform="rotate(72)"/>
      <use href="#k" transform="rotate(144)"/>
      <use href="#k" transform="rotate(216)"/>
      <use href="#k" transform="rotate(288)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <circle r="22" fill="#0b1020" stroke="#7dd3fc" stroke-width="3"/>
    <circle r="6" fill="#7dd3fc"/>
  </g>

  <!-- Başlık -->
  <text x="420" y="150" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#f8fafc" letter-spacing="-2">Pervane</text>
  <text x="424" y="200" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#a5b4fc">Open-source fan control for macOS</text>

  <!-- Fan eğrisi -->
  <g transform="translate(424 232)">
    <line x1="0" y1="70" x2="700" y2="70" stroke="#2a3558" stroke-width="2"/>
    <path d="M0 70 L150 70 L330 48 L500 22 L640 0 L700 0" fill="none" stroke="url(#isi)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0b1020" stroke-width="4">
      <circle cx="150" cy="70" r="8" stroke="#38bdf8"/>
      <circle cx="330" cy="48" r="8" stroke="#7aa7e0"/>
      <circle cx="500" cy="22" r="8" stroke="#fb923c"/>
      <circle cx="640" cy="0" r="8" stroke="#ef4444"/>
    </g>
    <g font-family="-apple-system, 'SF Mono', Menlo, monospace" font-size="15" fill="#64748b">
      <text x="134" y="98">45°</text>
      <text x="314" y="98">65°</text>
      <text x="484" y="98">80°</text>
      <text x="624" y="98">90°</text>
    </g>
  </g>
</svg>
